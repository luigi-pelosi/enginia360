# Synthetic ephemeral B08 acceptance; no published ports or retained volumes.
services:
  web:
    build:
      args:
        VITE_B08_TEST_UI: "true"
  postgres:
    volumes: !override
      - ./database/b03:/b03:ro
      - ./database/b04:/b04:ro
      - ./database/b05:/b05:ro
      - ./database/b06:/b06:ro
      - ./database/b07:/b07:ro
      - ./database/b08:/b08:ro
      - ./database/b09:/b09:ro
