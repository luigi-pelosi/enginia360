# Persistent private manual environment; always use the explicit project and env file.
services:
  keycloak:
    restart: unless-stopped
  postgres:
    restart: unless-stopped
  api:
    restart: unless-stopped
  web:
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - ./web/nginx.b02-manual.conf:/etc/nginx/nginx.conf:ro
