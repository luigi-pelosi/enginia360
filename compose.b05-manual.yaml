# Persistent private synthetic B05 only; never apply to earlier projects.
services:
  keycloak:
    restart: unless-stopped
  postgres:
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/18/docker
    volumes: !override
      - postgres_b05_storage:/var/lib/postgresql
      - ./database/b03:/b03:ro
      - ./database/b04:/b04:ro
      - ./database/b05:/b05:ro
  api:
    restart: unless-stopped
  web:
    restart: unless-stopped
    ports:
      - "127.0.0.1:18085:8080"
    volumes:
      - ./web/nginx.b02-manual.conf:/etc/nginx/nginx.conf:ro
volumes:
  postgres_b05_storage:
