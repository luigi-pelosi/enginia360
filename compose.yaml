name: enginia360

services:
  database:
    image: postgres:18.6-alpine3.24@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    container_name: enginia360-foundation-db
    restart: unless-stopped
    env_file:
      - /root/.config/enginia360/foundation-db.env
    volumes:
      - database_data:/var/lib/postgresql
    ports:
      - 127.0.0.1:5432:5432
    networks:
      application: {}
      database_access:
        gw_priority: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enginia360"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    image: enginia360-backend:foundation
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - /root/.config/enginia360/backend.env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - application_keys:/app/keys
    networks:
      - application
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: enginia360-frontend:foundation
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    ports:
      - 127.0.0.1:18080:3000
    networks:
      - application
      - ingress
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  database_data:
    external: true
    name: enginia360-foundation-db-data
  application_keys:
    external: true
    name: enginia360-application-keys

networks:
  application:
    internal: true
  ingress:
  database_access:
    driver: bridge

