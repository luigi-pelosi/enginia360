# Synthetic ephemeral B12 acceptance; no published ports or retained volumes.
services:
  api:
    environment:
      InternalBilling__Enabled: "true"
  postgres:
    volumes: !override
      - ./database/b03:/b03:ro
      - ./database/b04:/b04:ro
      - ./database/b05:/b05:ro
      - ./database/b06:/b06:ro
      - ./database/b07:/b07:ro
      - ./database/b08:/b08:ro
      - ./database/b09:/b09:ro
      - ./database/b10:/b10:ro
      - ./database/b11:/b11:ro
      - ./database/b12:/b12:ro
