# Separate persistent synthetic B03 project only. Never apply to B02.
services:
  keycloak:
    restart: unless-stopped
  postgres:
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/18/docker
    volumes: !override
      - postgres_storage_v5:/var/lib/postgresql
      - ./database/b03:/b03:ro
  api:
    restart: unless-stopped
  web:
    restart: unless-stopped
    ports:
      - "127.0.0.1:18083:8080"
    volumes:
      - ./web/nginx.b02-manual.conf:/etc/nginx/nginx.conf:ro
volumes:
  postgres_storage_v5:
    external: true
    name: enginia360-b03-manual_postgres_storage_v5
