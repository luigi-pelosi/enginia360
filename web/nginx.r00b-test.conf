worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    server_tokens off;
    map $uri $runtime_referrer { default same-origin; ~*^/signin-oidc no-referrer; }
    server {
        listen 8443 ssl;
        server_name app.r00.test;
        if ($http_host != "app.r00.test:8443") { return 400; }
        ssl_certificate /run/tls/web.crt;
        ssl_certificate_key /run/tls/web.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Referrer-Policy $runtime_referrer always;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self'; form-action 'self' https://idp.r00.test:8443; frame-ancestors 'none'; base-uri 'none'" always;
        location ~* ^/(api/v1/development/login|api/v1/organization/database-session|admin)(/|$) {
            add_header X-R00-Edge-Denial "1" always;
            return 404;
        }
        location = / {
            default_type text/html;
            root /usr/share/nginx;
            try_files /runtime-access.html =404;
        }
        location = /runtime-access.js {
            default_type application/javascript;
            alias /usr/share/nginx/runtime-access.js;
        }
        location / {
            proxy_pass https://api:8443;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /run/tls/ca.crt;
            proxy_ssl_server_name on;
            proxy_ssl_name api.r00.test;
            proxy_set_header Host app.r00.test:8443;
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_redirect off;
            proxy_hide_header Referrer-Policy;
        }
    }
}
