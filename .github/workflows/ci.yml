name: Bootstrap verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize ephemeral B02 configuration
        run: |
          printf 'B02_DB_NAME=enginia360\nB02_DB_USER=enginia360\nB02_DB_APP_USER=enginia360_app\n' >> "$GITHUB_ENV"
          owner_password="$(openssl rand -hex 24)"
          app_password="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$owner_password"
          printf '::add-mask::%s\n' "$app_password"
          printf 'B02_DB_PASSWORD=%s\nB02_DB_APP_PASSWORD=%s\n' "$owner_password" "$app_password" >> "$GITHUB_ENV"
      - name: Verify CI runtime configuration
        run: python3 scripts/test-ci-runtime.py
      - name: Integration tests in pinned SDK
        run: docker run --rm -v "$PWD:/source" -w /source mcr.microsoft.com/dotnet/sdk:10.0.402-alpine3.24 sh -c 'dotnet restore tests/Enginia360.Api.Tests --locked-mode && dotnet test tests/Enginia360.Api.Tests -c Release --no-restore'
      - name: UI tests, both builds and dependency audit
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24 sh -c 'npm ci --no-audit --no-fund && npm test && npm run build && VITE_B02_TEST_UI=true npm run build && npm audit --audit-level=high'
      - name: NuGet dependency audits
        run: docker run --rm -v "$PWD:/source" -w /source mcr.microsoft.com/dotnet/sdk:10.0.402-alpine3.24 sh -c 'dotnet restore tests/Enginia360.Api.Tests --locked-mode && dotnet list src/Enginia360.Api package --vulnerable --include-transitive && dotnet list tests/Enginia360.Api.Tests package --vulnerable --include-transitive'
      - name: Isolated B02 integration and hardening
        run: sh scripts/run-b02-tests.sh
      - name: Isolated B03 authorization, persistence and UI runtime
        run: sh scripts/run-b03-tests.sh
      - name: Build and start hardened containers
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: HTTP smoke tests
        run: sh scripts/smoke.sh
      - name: Container diagnostics
        if: always()
        run: docker compose ps && docker compose logs --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down
