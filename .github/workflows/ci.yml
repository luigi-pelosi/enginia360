name: Bootstrap verification
on:
  pull_request:
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Exact base SHA for change-impact selection (empty selects main or its first parent)
        type: string
        required: false
        default: ''
      full_architecture:
        description: Explicit exceptional architecture-wide run, not a routine delivery gate
        type: boolean
        required: false
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  impact:
    if: ${{ !inputs.full_architecture }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api_filter: ${{ steps.selection.outputs.api_filter }}
      ui_build: ${{ steps.selection.outputs.ui_build }}
      ui_tests: ${{ steps.selection.outputs.ui_tests }}
      browser: ${{ steps.selection.outputs.browser }}
      ui01b: ${{ steps.selection.outputs.ui01b }}
      r03a: ${{ steps.selection.outputs.r03a }}
      r03a2: ${{ steps.selection.outputs.r03a2 }}
      r04a: ${{ steps.selection.outputs.r04a }}
      r04c1: ${{ steps.selection.outputs.r04c1 }}
      r04c2: ${{ steps.selection.outputs.r04c2 }}
      r06b1: ${{ steps.selection.outputs.r06b1 }}
      r03b: ${{ steps.selection.outputs.r03b }}
      r03c: ${{ steps.selection.outputs.r03c }}
      migrations: ${{ steps.selection.outputs.migrations }}
      r06_offline: ${{ steps.selection.outputs.r06_offline }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Initialize private impact scratch directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify impact selection and direct runtime contracts
        run: python3 scripts/test-ci-impact.py && python3 scripts/test-ui01b-impact.py && python3 scripts/test-r03a-impact.py && python3 scripts/test-r03a2-impact.py && python3 scripts/test-r04a-impact.py && python3 scripts/test-r04c1-impact.py && python3 scripts/test-r04c2-impact.py && python3 scripts/test-r04c2-guard-mutation.py && python3 scripts/test-r04c1-guard-mutation.py && python3 scripts/test-r06b1-impact.py && python3 scripts/test-r06b2-impact.py && python3 scripts/test-r06b1-guards.py && python3 scripts/test-r03b-impact.py && python3 scripts/test-r03c-impact.py && python3 scripts/test-r03b-migration.py && python3 scripts/test-r03a-contract.py && python3 scripts/test-ui01b-wiring.py && python3 scripts/test-r00a-ci.py && python3 scripts/test-r00b-migration-tls.py && python3 scripts/test-r00b-lifecycle.py && python3 scripts/test-ci-runtime.py && python3 scripts/test-c00-consistency.py && python3 scripts/test-productization-consistency.py
      - name: Verify finite authority documentation impact
        run: python3 scripts/test-r04-authority-impact.py
      - name: Select exact changed-file impact
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.comparison_base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-parse origin/main)"
            if [ "$BASE_SHA" = "$HEAD_SHA" ]; then BASE_SHA="$(git rev-parse HEAD^)"; fi
          fi
          python3 scripts/select-ci-impact.py --base "$BASE_SHA" --head "$HEAD_SHA" > "$RUNNER_TEMP/impact.json"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/impact.json")); print(json.dumps(d,indent=2)); f=open(os.environ["GITHUB_OUTPUT"],"a"); [f.write(k+"="+(str(v).lower() if isinstance(v,bool) else v)+"\n") for k,v in d.items() if k!="changed_paths"]; f.close(); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## Exact change-impact selection\n```json\n"+json.dumps(d,indent=2)+"\n```\nRuntime jobs run only on explicit dispatch; skipped runtime is not acceptance evidence.\n")'
  affected-r06-offline:
    needs: impact
    if: needs.impact.outputs.r06_offline == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Offline inventory, reconciliation and readiness registry (not operational approval)
        run: python3 -I scripts/test-r06-impact.py && python3 -I scripts/test-r06-inventory.py && python3 -I scripts/test-r06-reconcile.py && python3 -I scripts/test-r06b2-impact.py && python3 -I scripts/test-r06-readiness.py && python3 -I scripts/r06_readiness.py
      - name: Offline stock and purchasing authority correction (not product setup enforcement)
        run: python3 -I scripts/test-r04-authority-impact.py && python3 -I scripts/test-r04-authority.py && python3 -I scripts/test-r04-authority.py --check
  affected-api:
    needs: impact
    if: needs.impact.outputs.api_filter != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fast API tests and dependency audit
        env:
          API_FILTER: ${{ needs.impact.outputs.api_filter }}
        run: docker run --rm -e API_FILTER -v "$PWD:/source" -w /source mcr.microsoft.com/dotnet/sdk:10.0.402-alpine3.24@sha256:230c3fbae0ceedc70bca04eed2bfb5694e8b248cadbb81010f41b7a993601f55 sh -c 'dotnet restore tests/Enginia360.Api.Tests --locked-mode && dotnet test tests/Enginia360.Api.Tests -c Release --no-restore --filter "$API_FILTER" && dotnet publish src/Enginia360.Api -c Release --no-restore -o /proof /p:UseAppHost=false && dotnet list src/Enginia360.Api package --vulnerable --include-transitive && dotnet list tests/Enginia360.Api.Tests package --vulnerable --include-transitive'
  affected-ui:
    needs: impact
    if: needs.impact.outputs.ui_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fast UI tests, builds and dependency audit
        env:
          UI_TESTS: ${{ needs.impact.outputs.ui_tests }}
          UI01B: ${{ needs.impact.outputs.ui01b }}
        run: docker run --rm -e UI_TESTS -e UI01B -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && if [ "$UI01B" = true ]; then npm test -- src/ui01/runtime src/ui01/WorkshopEditor.test.tsx src/ui01/Editor.acceptance.test.tsx --maxWorkers=1; elif [ "$UI_TESTS" = true ]; then npm test; else printf "UI test selection unchanged React source - runtime shell exercised in browser job\n"; fi && npm run build && npm run build:ui01 && if [ "$UI01B" = true ]; then npm run build:ui01-runtime; fi && npm audit --audit-level=high'
  affected-migrations:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private migration scratch directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Direct fixture-free migrations, binding, RLS and pool dependencies
        run: timeout 600 sh scripts/run-r00a-tests.sh
      - name: Direct migration failure and TERM cleanup
        run: timeout 180 python3 scripts/test-r00a-lifecycle.py
  affected-browser:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private browser scratch directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Actual CA-trusted TLS Chromium OIDC session and recovery
        run: timeout 600 python3 scripts/run-r00b-tests.py
      - name: Actual browser child and paused-database TERM cleanup
        run: timeout 300 python3 scripts/test-r00b-lifecycle.py --actual
  affected-editor:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.ui01b == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private editor scratch directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build separate opt-in runtime editor
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && npm run build:ui01-runtime'
      - name: Actual editor Chromium TLS OIDC API PostgreSQL acceptance
        run: timeout 600 python3 scripts/run-ui01b-tests.py
      - name: Actual editor paused-database TERM cleanup
        run: timeout 300 python3 scripts/test-r00b-lifecycle.py --actual --editor
      - name: Nonroot synthetic fixture extension retains readonly browser mount
        run: docker run --rm --user 1001:1001 --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --network none --memory=128m --pids-limit=32 --tmpfs /tmp:rw,noexec,nosuid,size=16m,uid=1001,gid=1001 -v "$PWD:/source:ro" -w /source python:3.14.3-alpine3.23@sha256:faee120f7885a06fcc9677922331391fa690d911c020abb9e8025ff3d908e510 python3 scripts/test-ui01b-fixture.py
  affected-r03a:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.r03a == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private R03.a scratch directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build separate opt-in runtime editor
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && npm run build:ui01-runtime'
      - name: Actual order-workspace Chromium TLS OIDC API PostgreSQL acceptance
        run: timeout 600 python3 scripts/run-r03a-tests.py
      - name: Actual order-workspace paused-database TERM cleanup
        run: timeout 300 python3 scripts/test-r00b-lifecycle.py --actual --r03a
  affected-r03a2:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.r03a2 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private R03.a.2 scratch directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build separate opt-in runtime editor
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && npm run build:ui01-runtime'
      - name: Actual R03.a.2 direct-consumer acceptance with separate-connection barriers
        run: timeout 600 python3 scripts/run-r03a2-tests.py
      - name: Actual public-contract pool1 completion and direct consumers
        run: R03A2_POOL_SIZE=1 timeout 600 python3 scripts/run-r03a2-tests.py
      - name: Actual TERM with held SQL barrier and Chromium alive
        run: timeout 300 python3 scripts/test-r03a2-lifecycle.py
  affected-r04a:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.r04a == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private R04.a scratch directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build separate opt-in runtime editor
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && npm run build:ui01-runtime'
      - name: Actual material UI TLS OIDC API PostgreSQL acceptance pool4
        run: timeout 600 python3 scripts/run-r04a-tests.py
      - name: Actual material public contracts and UI pool1
        run: R04A_POOL_SIZE=1 timeout 600 python3 scripts/run-r04a-tests.py
      - name: Actual material TERM with Chromium and a held SQL stock lock
        run: timeout 300 python3 scripts/test-r04a-lifecycle.py
  affected-r04c1:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.r04c1 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private release scratch
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build separate opt-in runtime editor
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && npm run build:ui01-runtime'
      - name: Actual explicit release TLS OIDC SQL acceptance pool4
        run: timeout 600 python3 scripts/run-r04c1-tests.py
      - name: Actual explicit release pool1 completion
        run: R04A_POOL_SIZE=1 timeout 600 python3 scripts/run-r04c1-tests.py
      - name: Actual release TERM with Chromium and held SQL line lock
        run: timeout 420 python3 scripts/test-r04c1-lifecycle.py
  affected-r04c2:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.r04c2 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private new part return scratch
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build separate opt-in runtime editor
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && npm run build:ui01-runtime'
      - name: Actual explicit new part return TLS OIDC SQL acceptance pool4
        run: timeout 600 python3 scripts/run-r04c2-tests.py
      - name: Actual explicit new part return pool1 completion
        run: R04A_POOL_SIZE=1 timeout 600 python3 scripts/run-r04c2-tests.py
      - name: Actual new part return TERM with Chromium and held SQL line lock
        run: timeout 420 python3 scripts/test-r04c2-lifecycle.py
  affected-r06-restore:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.r06b1 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private restore rehearsal scratch
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build separate opt-in runtime editor
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && npm run build:ui01-runtime'
      - name: Synthetic ephemeral single-host restore rehearsal (not DR, RPO, RTO, SLA or PITR evidence)
        run: timeout 600 python3 scripts/run-r06b1-tests.py
      - name: Offline restore lifecycle guards
        run: python3 scripts/test-r06b1-lifecycle.py
      - name: Actual TERM while pg_dump is blocked on a held SQL lock
        run: timeout 420 python3 scripts/test-r06b1-lifecycle.py --actual dump
      - name: Actual TERM while pg_restore is in flight under the migration advisory lock
        run: timeout 420 python3 scripts/test-r06b1-lifecycle.py --actual restore
      - name: Actual TERM while Chromium and a held SQL lock are alive
        run: timeout 420 python3 scripts/test-r06b1-lifecycle.py --actual browser
  affected-r03b:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.r03b == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private R03.b scratch directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build separate opt-in runtime editor
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && npm run build:ui01-runtime'
      - name: Actual own ledger TLS OIDC Chromium SQL barriers and direct consumers pool4
        run: timeout 600 python3 scripts/run-r03b-tests.py
      - name: Actual own ledger pool1 completion no nested connection
        run: R03B_POOL_SIZE=1 timeout 600 python3 scripts/run-r03b-tests.py
      - name: Actual TERM with Chromium and held canonical order lock
        run: timeout 300 python3 scripts/test-r03b-lifecycle.py
  affected-r03c:
    needs: impact
    if: github.event_name == 'workflow_dispatch' && needs.impact.outputs.r03c == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private R03.c scratch directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build separate opt-in runtime editor
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && npm run build:ui01-runtime'
      - name: Closure read model and snapshot consistency against real PostgreSQL pool1 and pool4
        run: timeout 600 python3 scripts/run-r03c-api-tests.py
      - name: Actual closure panel TLS OIDC Chromium isolated simulator SQL barriers pool4
        run: timeout 600 python3 scripts/run-r03c-tests.py
      - name: Actual closure panel pool1 completion
        run: R03C_POOL_SIZE=1 timeout 600 python3 scripts/run-r03c-tests.py
      - name: Actual TERM with Chromium, simulator and held canonical order lock
        run: timeout 300 python3 scripts/test-r03c-lifecycle.py
  runtime-migrations:
    if: github.event_name == 'workflow_dispatch' && inputs.full_architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize private R00.a scratch directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify R00.a CI selection and cleanup guards
        run: python3 scripts/test-r00a-ci.py
      - name: Fixture-free R00.a PostgreSQL migrations and recovery
        run: timeout 600 sh scripts/run-r00a-tests.sh
      - name: Real R00.a failure and TERM cleanup
        run: timeout 180 python3 scripts/test-r00a-lifecycle.py
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.full_architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Initialize ephemeral B02 configuration
        run: |
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'B02_DB_NAME=enginia360\nB02_DB_USER=enginia360\nB02_DB_APP_USER=enginia360_app\n' >> "$GITHUB_ENV"
          owner_password="$(openssl rand -hex 24)"
          app_password="$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$owner_password"
          printf '::add-mask::%s\n' "$app_password"
          printf 'B02_DB_PASSWORD=%s\nB02_DB_APP_PASSWORD=%s\n' "$owner_password" "$app_password" >> "$GITHUB_ENV"
      - name: Verify CI runtime configuration
        timeout-minutes: 10
        run: python3 scripts/test-ui01-ci.py && python3 scripts/test-c00-consistency.py && python3 scripts/test-productization-consistency.py && python3 scripts/test-b10-reset-lifecycle.py && python3 scripts/test-ci-runtime.py && python3 scripts/test-b04-ci.py && python3 scripts/test-b05-ci.py && python3 scripts/test-b06-ci.py && python3 scripts/test-b07-ci.py && python3 scripts/test-b08-ci.py && python3 scripts/test-b09-ci.py && python3 scripts/test-b10-ci.py && python3 scripts/test-b11-ci.py && python3 scripts/test-b12-ci.py && python3 scripts/test-b13-ci.py && python3 scripts/test-b14-ci.py && python3 scripts/test-b14-restore-contract.py && python3 scripts/test-b14-diagnostics-unit.py
      - name: Offline B09 carcass return race controller lifecycle
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        run: timeout 60 python3 scripts/test-b09-return-race-lifecycle.py
      - name: Offline B08 installation race controller lifecycle
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        run: timeout 60 python3 scripts/test-b08-installation-race-lifecycle.py
      - name: Offline B07 picking race controller lifecycle
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        run: timeout 60 python3 scripts/test-b07-picking-race-lifecycle.py
      - name: Offline B06 race controller lifecycle
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        run: timeout 60 python3 scripts/test-b06-stock-race-lifecycle.py
      - name: Fast API tests and dependency audit
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/source" -w /source mcr.microsoft.com/dotnet/sdk:10.0.402-alpine3.24@sha256:230c3fbae0ceedc70bca04eed2bfb5694e8b248cadbb81010f41b7a993601f55 sh -c 'dotnet restore tests/Enginia360.Api.Tests --locked-mode && dotnet test tests/Enginia360.Api.Tests -c Release --no-restore && dotnet list src/Enginia360.Api package --vulnerable --include-transitive && dotnet list tests/Enginia360.Api.Tests package --vulnerable --include-transitive'
      - name: Fast UI tests, builds and dependency audit
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && npm test && npm run build && npm run build:ui01 && npm audit --audit-level=high'
      - name: Legacy B02-B07 private UI build matrix
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'npm ci --no-audit --no-fund && VITE_B02_TEST_UI=true npm run build && VITE_B03_TEST_UI=true npm run build && VITE_B04_TEST_UI=true npm run build && VITE_B05_TEST_UI=true npm run build && VITE_B06_TEST_UI=true npm run build && VITE_B06_TEST_UI=true VITE_B07_TEST_UI=true npm run build'
      - name: Private B08 UI build
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/source" -w /source/web node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f sh -c 'VITE_B06_TEST_UI=true VITE_B07_TEST_UI=true VITE_B08_TEST_UI=true npm run build'
      - name: Private B09 UI build
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
