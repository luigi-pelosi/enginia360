# Ephemeral B07 acceptance only; inherits private, hardened B06 services.
services:
  web:
    build:
      args:
        VITE_B07_TEST_UI: "true"
  postgres:
    volumes: !override
      - ./database/b03:/b03:ro
      - ./database/b04:/b04:ro
      - ./database/b05:/b05:ro
      - ./database/b06:/b06:ro
      - ./database/b07:/b07:ro
      - ./database/b08:/b08:ro
